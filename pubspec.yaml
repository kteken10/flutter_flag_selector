name: flutter_flag_selector
description: Country picker for Flutter with SVG flags, dial codes, search, country names in 20 languages and four display modes. Ideal for phone number inputs.
version: 1.0.1
homepage: https://github.com/kteken10/flutter_flag_selector
repository: https://github.com/kteken10/flutter_flag_selector
issue_tracker: https://github.com/kteken10/flutter_flag_selector/issues
documentation: https://github.com/kteken10/flutter_flag_selector#readme

# pub.dev accepte au plus 5 topics.
topics:
  - country-picker
  - flags
  - i18n
  - localization
  - phone

screenshots:
  - description: 'Bottom sheet mode: searching "ger" puts Germany first.'
    path: screenshots/bottom_sheet.gif
  - description: Country picker in dialog mode.
    path: screenshots/dialog.gif
  - description: Country picker in popup menu mode.
    path: screenshots/popup_menu.gif
  - description: Draggable sheet that resizes when the list is dragged.
    path: screenshots/draggable_sheet.gif
  - description: Country names in English, French and Japanese.
    path: screenshots/languages.gif

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/images/

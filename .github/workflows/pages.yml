# Site du package : page d'accueil (site/) + démo Flutter web (example/),
# publiés sur GitHub Pages à chaque push sur main.
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Démo Flutter web
        working-directory: example
        run: |
          flutter pub get
          flutter build web --release --base-href /flutter_flag_selector/demo/
      - name: Assemblage du site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r example/build/web _site/demo
          cp -r screenshots _site/screenshots
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
